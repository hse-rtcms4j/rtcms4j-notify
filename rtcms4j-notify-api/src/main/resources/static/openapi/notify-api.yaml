openapi: 3.0.3
info:
  title: RTCMS4J Notify-service API
  version: 1.0.0
servers:
  - url: /api/v1

paths:
  ############################
  # Managing configurations: #
  ############################
  /namespace/{nid}/application/{aid}/configuration/{cid}/ack:
    post:
      tags:
        - Notify
      summary: Acknowledge namespace application configuration schema
      operationId: acknowledgeConfiguration
      parameters:
        - name: nid
          description: Namespace id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: aid
          description: Application id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: cid
          description: Container id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationAcknowledge'
      responses:
        '200':
          description: Successful operation
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /namespace/{nid}/application/{aid}/configuration/{cid}/stream-state:
    put:
      tags:
        - Notify
      summary: Support core with real stream state
      operationId: updateStreamStateConfiguration
      parameters:
        - name: nid
          description: Namespace id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: aid
          description: Application id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: cid
          description: Container id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationStreamState'
      responses:
        '200':
          description: Successful operation
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  responses:
    BadRequest:
      description: Wrong or unexpected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Wrong token or authorization failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: Wrong method
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Not enough permissions to access
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Error on server side
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required:
        - messageCode
        - message
      properties:
        messageCode:
          type: integer
          format: int32
        message:
          type: string

    ConfigurationAcknowledge:
      type: object
      required:
        - commitHash
        - serviceId
      properties:
        commitHash:
          type: string
        serviceId:
          type: string

    ConfigurationStreamState:
      type: object
      required:
        - serviceId
        - connected
      properties:
        serviceId:
          type: string
        connected:
          type: boolean
